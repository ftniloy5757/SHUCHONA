name: shuchona
description: "SHUCHONA (সূচনা) - Offline-first Voice & Vision AI Healthcare, Prescription Safety, Behavioral Wellness, and Community Emergency Companion for Rural Bangladesh"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Typography & UI
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Backend & Offline-First Persistence
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_messaging: ^15.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # AI, Vision & Speech
  google_generative_ai: ^0.4.6
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
  image_picker: ^1.1.2

  # Notifications, Location & Utilities
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.3
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/prescriptions/
